name: Native control contract

# Recovered alongside desktop-release.yml (see that file's header comment for
# why) -- nothing in this repo's test suite asserts on this file's exact
# text, so this is a straightforward, sensible CI check rather than a
# reconstruction against a spec: run scripts/validateNativeControls.ts on
# every push/PR so a native-export control-mapping regression is caught in
# CI, not just when someone happens to run it locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run validate:native-controls
