openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Company-ready OrangeJUCE API contracts for health, organizations, projects, plugin generation, benchmarking, and artifacts.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: organizations
    description: Tenant and membership operations
  - name: projects
    description: Audio-project workspaces
  - name: plugins
    description: Plugin/version lifecycle operations
  - name: jobs
    description: Async generation and build jobs
  - name: benchmarks
    description: DSP quality evidence
  - name: artifacts
    description: Exported build artifacts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations visible to the caller
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organizations/{organizationId}/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List tenant-scoped projects
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project inside an organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /organizations/{organizationId}/projects/{projectId}/generation-jobs:
    post:
      operationId: createGenerationJob
      tags: [jobs]
      summary: Start an async plugin generation job
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGenerationJobRequest"
      responses:
        "202":
          description: Generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /organizations/{organizationId}/generation-jobs/{jobId}:
    get:
      operationId: getGenerationJob
      tags: [jobs]
      summary: Get generation job status
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
  /organizations/{organizationId}/projects/{projectId}/plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: List project plugins
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Plugin list
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plugin"
  /organizations/{organizationId}/plugins/{pluginId}/versions:
    post:
      operationId: createPluginVersion
      tags: [plugins]
      summary: Create a durable plugin version from generated DSP/UI contracts
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePluginVersionRequest"
      responses:
        "201":
          description: Created plugin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersion"
  /organizations/{organizationId}/plugin-versions/{pluginVersionId}/benchmark-reports:
    post:
      operationId: createBenchmarkReport
      tags: [benchmarks]
      summary: Attach DSP quality evidence to a plugin version
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PluginVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBenchmarkReportRequest"
      responses:
        "201":
          description: Created benchmark report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkReport"
  /organizations/{organizationId}/plugin-versions/{pluginVersionId}/artifacts:
    get:
      operationId: listBuildArtifacts
      tags: [artifacts]
      summary: List export artifacts for a plugin version
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/PluginVersionId"
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuildArtifact"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginVersionId:
      name: pluginVersionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Timestamped:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Organization:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [name, slug, plan]
          properties:
            name: { type: string }
            slug: { type: string }
            plan: { type: string }
            metadata: { type: object, additionalProperties: true }
    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$" }
    Project:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [organizationId, name, status]
          properties:
            organizationId: { type: string, format: uuid }
            name: { type: string }
            description: { type: string }
            status: { type: string, enum: [active, archived] }
            metadata: { type: object, additionalProperties: true }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
    Plugin:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [organizationId, projectId, name, category]
          properties:
            organizationId: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            name: { type: string }
            category: { type: string }
            description: { type: string }
            currentVersionId: { type: string, format: uuid }
    PluginVersion:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [organizationId, pluginId, version, state, prompt, dspSource, uiContract, parameterContract]
          properties:
            organizationId: { type: string, format: uuid }
            pluginId: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            state: { type: string, enum: [draft, benchmarked, approved, release_candidate, released, archived] }
            prompt: { type: string }
            modelProvider: { type: string }
            modelName: { type: string }
            dspSource: { type: string }
            uiContract: { type: object, additionalProperties: true }
            parameterContract:
              type: array
              items: { type: object, additionalProperties: true }
            qualitySummary: { type: object, additionalProperties: true }
    CreatePluginVersionRequest:
      type: object
      required: [prompt, dspSource, uiContract, parameterContract]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 40000 }
        modelProvider: { type: string }
        modelName: { type: string }
        dspSource: { type: string, minLength: 1 }
        uiContract: { type: object, additionalProperties: true }
        parameterContract:
          type: array
          items: { type: object, additionalProperties: true }
        qualitySummary: { type: object, additionalProperties: true }
    GenerationJob:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [organizationId, projectId, status, prompt]
          properties:
            organizationId: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            pluginVersionId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
            prompt: { type: string }
            provider: { type: string }
            model: { type: string }
            error: { type: string }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
    CreateGenerationJobRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 40000 }
        provider: { type: string }
        model: { type: string }
    BenchmarkReport:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [organizationId, pluginVersionId, status, score]
          properties:
            organizationId: { type: string, format: uuid }
            pluginVersionId: { type: string, format: uuid }
            status: { type: string, enum: [passed, failed, warning] }
            score: { type: integer, minimum: 0, maximum: 100 }
            latencyMs: { type: number }
            cpuPercent: { type: number }
            peakDbfs: { type: number }
            dcOffset: { type: number }
            findings:
              type: array
              items: { type: object, additionalProperties: true }
            evidence: { type: object, additionalProperties: true }
    CreateBenchmarkReportRequest:
      type: object
      required: [status, score]
      properties:
        status: { type: string, enum: [passed, failed, warning] }
        score: { type: integer, minimum: 0, maximum: 100 }
        latencyMs: { type: number }
        cpuPercent: { type: number }
        peakDbfs: { type: number }
        dcOffset: { type: number }
        findings:
          type: array
          items: { type: object, additionalProperties: true }
        evidence: { type: object, additionalProperties: true }
    BuildArtifact:
      allOf:
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [organizationId, pluginVersionId, kind, storageUrl, checksumSha256, sizeBytes, signed]
          properties:
            organizationId: { type: string, format: uuid }
            pluginVersionId: { type: string, format: uuid }
            kind: { type: string, enum: [faust, juce_cpp, vst3, au, aax, report, preset_pack] }
            storageUrl: { type: string }
            checksumSha256: { type: string }
            sizeBytes: { type: integer, minimum: 0 }
            signed: { type: boolean }
            provenance: { type: object, additionalProperties: true }
